    "body_state_hz": 60,
    "gaze_stale_s": 1.0,
    "animation_jitter_p99_ms": 3.0
  },
  "network": {
    "websocket_url": "ws://127.0.0.1:8765"
  },
  "gaze": {
    "yaw_threshold_deg": 25.0,
