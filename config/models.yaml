        "path": "~/.cache/lumen/en_US-lessac-medium.onnx.json",
        "served_at": null
      },
      "url": "https://huggingface.co/rhasspy/piper-voices/resolve/f5a6e9094787fd865d65cb024472f977f9c542b5/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json",
      "url_canonical": true,
      "url_note": "Same pinned commit as the voice weights. Piper requires the config to sit beside the .onnx it describes.",
      "sha256": "efe19c417bed055f2d69908248c6ba650fa135bc868b0e6abb3da181dab690a0",
      "sha256_source": "Computed locally with shasum -a 256 over the 4885-byte file fetched from the pinned URL above. This file is a small JSON config, not model weights, so it was downloaded and hashed directly rather than trusted from a header. It is not a git-lfs object, so no publisher digest exists for it.",
      "size_bytes": 4885,
      "size_note": "4.8 KiB",
      "license": "Blizzard Challenge 2013 Lessac corpus licence",
      "license_source": "https://www.cstr.ed.ac.uk/projects/blizzard/2013/lessac_blizzard2013/license.html - inherits the voice's licence.",
      "verify_command": "sha256sum ~/.cache/lumen/en_US-lessac-medium.onnx.json   # macOS: shasum -a 256 ~/.cache/lumen/en_US-lessac-medium.onnx.json",
      "notes": "Verified content at this digest: audio.sample_rate 22050, phoneme_type espeak, espeak.voice en-us, num_symbols 256, num_speakers 1, phoneme_map {}, and a 154-entry phoneme_id_map whose special symbols are _ = 0, ^ = 1, $ = 2, space = 3. Every key in that map is a single codepoint, so multi-codepoint handling in phonemes.py is defensive rather than exercised by this voice."
    },
