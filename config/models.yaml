{
  "manifest_version": 1,
  "about": [
    "Pinned asset manifest. setup.sh downloads these into ~/.cache/lumen (core)",
    "or renderer/public (browser), verifies SHA-256, and never commits weights.",
    "This file is JSON-compatible YAML for the same reason as config/default.yaml:",
    "JSON is a strict YAML subset, so the repo needs no YAML dependency. JSON has",
    "no comment syntax, so every provenance note that would have been a comment is",
    "an explicit field instead - sha256_source, license_source, verify_command and",
    "notes. Those fields are greppable and are asserted by the validation tooling",
    "RULE: sha256 is either a 64-character lowercase hex digest or the literal",
    "marker UNVERIFIED. Never write a guessed digest. An UNVERIFIED entry is a known",
    "gap with a recorded reason and the exact command that closes it.",
    "RULE: every required_files path is relative to its own entry's destination.path",
    "directory - never to the upstream package root, never absolute, never with a",
    ".. segment. Joining destination.path with the required_files path must give the",
    "staged file, so renderer/public/onnxruntime/wasm plus ort-wasm-simd-threaded.mjs",
    "is the whole path, and a leading wasm/ on an entry whose destination already ends",
    "in wasm would duplicate that segment. A directory entry's own sha256 is",
    "UNVERIFIED by construction, because a directory has no single digest, so",
    "required_files is how that entry is verified at all. the validation tooling",
    "asserts this rooting and doctor.py depends on it."
  ],
  "unverified_marker": "UNVERIFIED",
  "destinations": {
    "core_cache": {
      "root": "~/.cache/lumen",
      "note": "PRD 12.1. Core-side weights, outside the repo, never committed."
    },
    "browser_public": {
      "root": "renderer/public",
      "note": "Vite static root. Served at the paths the sensors already request. The repo .gitignore ignores models/, so weights staged here are never committed."
    }
  },
  "assets": [
    {
      "name": "whisper_base_en_q5",
      "kind": "file",
      "consumers": ["core/speech/stt.py"],
      "consumer_detail": "WhisperCppSpeechToText model_path. _MODEL_NAME accepts ggml-base.en-q5_0.bin or ggml-base.en-q5_1.bin.",
      "destination": {
        "layout": "core_cache",
        "path": "~/.cache/lumen/ggml-base.en-q5_1.bin",
        "served_at": null
      },
      "url": "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en-q5_1.bin",
      "url_canonical": true,
      "url_note": "Upstream whisper.cpp model repo, pinned to commit 5359861c739e955e79d9a303bcbc70fb988958b1 rather than main so the bytes cannot move.",
      "sha256": "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f",
      "sha256_source": "https://huggingface.co/api/models/ggerganov/whisper.cpp/tree/main - Hugging Face publishes lfs.oid for this file, and git-lfs uses SHA-256 as its object-id algorithm. The same digest is returned as the X-Linked-Etag header on a HEAD of the download URL. Two independent publisher responses agree; no bytes were downloaded.",
      "size_bytes": 59721011,
      "size_note": "57 MiB",
      "license": "MIT",
      "license_source": "https://huggingface.co/ggerganov/whisper.cpp - repo card license: mit. OpenAI Whisper weights are MIT and the ggml conversion is published under the whisper.cpp MIT licence.",
      "verify_command": "sha256sum ~/.cache/lumen/ggml-base.en-q5_1.bin   # macOS: shasum -a 256 ~/.cache/lumen/ggml-base.en-q5_1.bin",
      "notes": "PRD 2 names base.en Q5. The canonical repo publishes ONLY q5_1 for base.en - there is no ggml-base.en-q5_0.bin in ggerganov/whisper.cpp, so q5_1 is the approved q5 variant and is what stt.py's regex must match. Build whisper.cpp from source with CPU-only flags per PRD 12.3; the binary is not an asset in this manifest."
    },
    {
      "name": "piper_voice_en_us_lessac_medium",
      "kind": "file",
      "consumers": ["core/speech/tts.py", "core/speech/phonemes.py"],
