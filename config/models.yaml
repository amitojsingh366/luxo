      "destination": {
        "layout": "core_cache",
        "path": "~/.cache/lumen/en_US-lessac-medium.onnx",
        "served_at": null
      },
      "url": "https://huggingface.co/rhasspy/piper-voices/resolve/f5a6e9094787fd865d65cb024472f977f9c542b5/en/en_US/lessac/medium/en_US-lessac-medium.onnx",
      "url_canonical": true,
      "url_note": "Official Piper voice repository, pinned to commit f5a6e9094787fd865d65cb024472f977f9c542b5 rather than main.",
      "sha256": "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f",
      "sha256_source": "https://huggingface.co/api/models/rhasspy/piper-voices/tree/main/en/en_US/lessac/medium - published as lfs.oid, and confirmed identical to the X-Linked-Etag header on a HEAD of the download URL. git-lfs object ids are SHA-256. No bytes were downloaded.",
      "size_bytes": 63201294,
      "size_note": "60 MiB",
      "license": "Blizzard Challenge 2013 Lessac corpus licence",
      "license_source": "https://www.cstr.ed.ac.uk/projects/blizzard/2013/lessac_blizzard2013/license.html - cited by the voice's own MODEL_CARD at the pinned commit.",
      "verify_command": "sha256sum ~/.cache/lumen/en_US-lessac-medium.onnx   # macOS: shasum -a 256 ~/.cache/lumen/en_US-lessac-medium.onnx",
      "notes": "OWNER ACTION: this is a research-corpus licence, not a permissive one. It is fine for a recorded challenge demo but must be reviewed before any commercial or redistributed use. Permissively-licensed alternatives were checked: en_US-ryan-medium is CC BY-NC-SA 4.0 (also non-commercial) and en_US-amy-medium's MODEL_CARD says only 'See URL'. No clearly permissive 22.05 kHz espeak-type en_US voice was found.",
      "voice": {
        "phoneme_type": "espeak",
        "espeak_voice": "en-us",
